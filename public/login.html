<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 · Palbox</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles/index.css"><script type="module" src="/src/login.js"></script></head>
<body class="login-page"><main class="login-card"><div class="eyebrow">PALBOX SERVER MANAGER</div><h1>管理你的帕鲁世界</h1><p>输入管理员用户名和密码以继续。</p><form id="login-form"><label for="login-username">管理员用户名</label><input id="login-username" type="text" autocomplete="username" maxlength="64" required autofocus><label for="login-password">管理密码</label><input id="login-password" type="password" autocomplete="current-password" required><p id="login-error" class="alert error" role="alert" hidden></p><button class="button primary" type="submit">登录面板</button></form></main></body>
</html>
