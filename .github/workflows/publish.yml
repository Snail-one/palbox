name: Publish containers

on:
  push:
    tags: ['**']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish (for example v1.0.0)
        type: string
        required: true

permissions:
  contents: read

# Serialize releases so concurrent builds do not race to update latest.
concurrency:
  group: publish-containers-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and resolve commit
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'Git tag must also be a valid Docker tag (1–128 letters, digits, underscores, dots or hyphens).' >&2
            exit 1
          fi
          git check-ref-format "refs/tags/${RELEASE_TAG}"
          sha=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          printf 'tag=%s\nsha=%s\nimage=ghcr.io/%s\n' "$RELEASE_TAG" "$sha" "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.target }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: backend
            suffix: ''
          - target: frontend
            suffix: '-frontend'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Git tag and latest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.release.outputs.image }}${{ matrix.suffix }}:${{ needs.release.outputs.tag }}
            ${{ needs.release.outputs.image }}${{ matrix.suffix }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release.outputs.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Summarize published image
        env:
          IMAGE: ${{ needs.release.outputs.image }}${{ matrix.suffix }}
          TAG: ${{ needs.release.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### Published image\n\n- `%s:%s`\n- `%s:latest`\n- Digest: `%s`\n' "$IMAGE" "$TAG" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
