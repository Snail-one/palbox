<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 · PalBox</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles/index.css"><script type="module" src="/src/login.js"></script></head>
<body class="login-page"><main class="login-card"><a class="brand" href="/" aria-label="PalBox 首页"><span class="brand-symbol"><img src="/assets/favicon.svg" width="40" height="40" alt=""></span><span>PalBox</span></a><div class="eyebrow">PalBox SERVER MANAGER</div><h1>管理你的帕鲁世界</h1><p id="login-description">输入管理员用户名和密码以继续。</p><form id="login-form"><div id="login-password-step"><label for="login-username">管理员用户名</label><input id="login-username" type="text" autocomplete="username" maxlength="64" required autofocus><label for="login-password">管理密码</label><input id="login-password" type="password" autocomplete="current-password" required></div><div id="login-totp-step" hidden><label for="login-code">动态验证码</label><input id="login-code" type="text" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"><button id="login-use-recovery" type="button" class="button secondary">使用恢复码</button></div><p id="login-error" class="alert error" role="alert" hidden></p><button id="login-submit" class="button primary" type="submit">登录面板</button><button id="login-back" class="button secondary" type="button" hidden>返回密码登录</button></form></main></body>
</html>
