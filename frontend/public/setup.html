<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>初始化 · PalBox</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles/index.css"><script type="module" src="/src/setup.js"></script></head>
<body class="login-page">
<main class="login-card">
  <a class="brand" href="/" aria-label="PalBox 首页"><span class="brand-symbol"><img src="/assets/favicon.svg" width="40" height="40" alt=""></span><span>PalBox</span></a>
  <div class="eyebrow">PalBox SERVER MANAGER</div>
  <h1>创建管理员账号</h1>
  <p>首次使用，请填写一次性初始化码，设置管理员用户名和至少 12 位的密码。</p>
  <form id="setup-form">
    <label for="setup-code">一次性初始化码</label>
    <input id="setup-code" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" pattern="[a-fA-F0-9]{32}" maxlength="32" aria-describedby="setup-code-help" required autofocus>
    <p id="setup-code-help">从服务器启动终端或后端容器日志获取。重启后会更新，注册成功后失效。</p>
    <label for="setup-username">管理员用户名</label>
    <input id="setup-username" type="text" autocomplete="username" maxlength="64" required>
    <label for="setup-password">管理密码</label>
    <input id="setup-password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required>
    <label for="setup-confirm">确认密码</label>
    <input id="setup-confirm" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required>
    <p id="setup-error" class="alert error" role="alert" hidden></p>
    <button class="button primary" type="submit">创建管理员</button>
  </form>
</main>
</body>
</html>
