# 在线镜像部署：只需此文件，无需源码或 Dockerfile。
# 启动：docker compose -f compose.ghcr.yaml up -d
# 更新：docker compose -f compose.ghcr.yaml pull，再执行启动命令。
# 固定版本时，将两个镜像的 latest 一起改为同一个 Git tag，例如 v1.0.0。
services:
  frontend:
    image: ghcr.io/snail-one/palbox-frontend:latest
    platform: linux/amd64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # 远程访问时改成服务器内网 IP 或 0.0.0.0。
      - "127.0.0.1:8080:8080/tcp"
    environment:
      PALBOX_API_URL: "http://palbox:8081"
      # 外接代理时只填写该代理 IP/CIDR；默认忽略客户端转发头。
      PALBOX_TRUSTED_PROXIES: ""
    networks:
      management:
        ipv4_address: 172.30.83.2
    depends_on:
      palbox:
        condition: service_healthy
  palbox:
    image: ghcr.io/snail-one/palbox:latest
    platform: linux/amd64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 120s
    security_opt:
      - no-new-privileges:true
    ports:
      # 修改 PALBOX_GAME_PORT 时，同时修改这里的 UDP 端口映射。
      - "8211:8211/udp"
    environment:
      # 首次打开网页时创建面板管理员，无需在此配置登录密码。
      PALBOX_GAME_PORT: "8211"
      TZ: "UTC"
      PALBOX_SECURE_COOKIE: "false"
      PALBOX_TRUSTED_PROXIES: "172.30.83.2"
      # 按 UTC 自然日归档：每文件 MiB 上限、每天的额外分卷数、含当天的保留天数。
      PALBOX_LOG_MAX_MB: "5"
      PALBOX_LOG_BACKUPS: "1"
      PALBOX_LOG_RETENTION_DAYS: "7"
    networks:
      management:
        ipv4_address: 172.30.83.3
    volumes:
      # 数据保存在此 Compose 文件旁的 data 目录。
      - "./data:/data"
networks:
  management:
    ipam:
      config:
        - subnet: 172.30.83.0/29
