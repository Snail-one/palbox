services:
  frontend:
    build:
      context: .
      target: frontend
    image: palbox-frontend:local
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # 网页监听地址；需要内网访问时改成服务器内网 IP 或 0.0.0.0。
      - "127.0.0.1:8080:8080/tcp"
    environment:
      PALBOX_API_URL: "http://palbox:8081"
    depends_on:
      palbox:
        condition: service_healthy
  palbox:
    build:
      context: .
      target: backend
    image: palbox:local
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 120s
    security_opt:
      # 入口脚本用 gosu 降权，保留默认 capabilities，仅禁止提权。
      - no-new-privileges:true
    ports:
      # 游戏 UDP 端口：修改 PALBOX_GAME_PORT 时，这里的宿主机端口也要一起改。
      - "8211:8211/udp"
    expose:
      - "8081"
    environment:
      # 首次打开网页时创建管理员用户名和密码，无需在这里配置登录密码。
      PALBOX_GAME_PORT: "8211"
      PALBOX_SECURE_COOKIE: "false"
    volumes:
      # 宿主机数据目录，存放服务端、存档、备份和日志。
      - "./data:/data"
