services:
  frontend:
    build:
      context: .
      target: frontend
    image: palbox-frontend:local
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # 网页监听地址；需要内网访问时改成服务器内网 IP 或 0.0.0.0。
      - "127.0.0.1:8080:8080/tcp"
    environment:
      PALBOX_API_URL: "http://palbox:8081"
      # 直连客户端的转发头默认不采信；外接代理时只填写该代理 IP/CIDR。
      PALBOX_TRUSTED_PROXIES: ""
    networks:
      management:
        ipv4_address: 172.30.83.2
    depends_on:
      palbox:
        condition: service_healthy
  palbox:
    build:
      context: .
      target: backend
    image: palbox:local
    platform: linux/amd64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 120s
    security_opt:
      # 入口脚本用 gosu 降权，保留默认 capabilities，仅禁止提权。
      - no-new-privileges:true
    ports:
      # 游戏 UDP 端口：修改 PALBOX_GAME_PORT 时，这里的宿主机端口也要一起改。
      - "8211:8211/udp"
    environment:
      # 首次打开网页时创建管理员用户名和密码，无需在这里配置登录密码。
      PALBOX_GAME_PORT: "8211"
      TZ: "UTC"
      PALBOX_SECURE_COOKIE: "false"
      # 后端只采信前端容器提供的客户端地址。
      PALBOX_TRUSTED_PROXIES: "172.30.83.2"
      # 按 UTC 自然日归档：每文件 MiB 上限、每天的额外分卷数、含当天的保留天数。
      PALBOX_LOG_MAX_MB: "5"
      PALBOX_LOG_BACKUPS: "1"
      PALBOX_LOG_RETENTION_DAYS: "7"
    networks:
      management:
        ipv4_address: 172.30.83.3
    volumes:
      # 宿主机数据目录，存放服务端、存档、备份和日志。
      - "./data:/data"
networks:
  management:
    ipam:
      config:
        - subnet: 172.30.83.0/29
